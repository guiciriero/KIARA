# Build do instalador Windows (NSIS) do app desktop KIARA.
# Gatilhos: manual, push na main (publica a release "v1.0.<run_number>") e tags "v*".
# O instalador e a release só são gerados depois que o job "verify" (ci.yml) passar.
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# Um build por ref; builds antigos da main são cancelados por um mais novo.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

# Permissões mínimas por padrão; o job de publicação pede "contents: write" separadamente.
permissions:
  contents: read

env:
  # Versão fixada do cloudflared (cadeia de suprimentos: nunca usar "latest" em produção).
  # Ao subir de versão, atualize CLOUDFLARED_VERSION e CLOUDFLARED_SHA256 juntos —
  # o SHA-256 é do arquivo cloudflared-windows-amd64.exe da release correspondente.
  CLOUDFLARED_VERSION: "2026.10.1"
  CLOUDFLARED_SHA256: "4d2490e74082c5d48dbfedaf92576fa5bd1702379ab88eb7faa0cfbe8dc891b6"

jobs:
  # Verificação (lint, tipos, testes, build, audit e e2e): reutiliza o ci.yml.
  # O instalador e a release só saem se ela passar.
  # Segredos repassados explicitamente — "secrets: inherit" enviaria SIGNPATH_API_TOKEN
  # e outros segredos desnecessários ao ci.yml; repasse mínimo é mais seguro.
  verify:
    name: Verificar (CI)
    uses: ./.github/workflows/ci.yml
    secrets:
      REDHAT_REGISTRY_USER: ${{ secrets.REDHAT_REGISTRY_USER }}
      REDHAT_REGISTRY_TOKEN: ${{ secrets.REDHAT_REGISTRY_TOKEN }}

  build:
    name: Compilar instalador
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # A assinatura só acontece em tags v* e quando o segredo SIGNPATH_API_TOKEN existe.
      # Sem ele, o build segue normal e gera o instalador sem assinatura.
      SIGN_INSTALLER: ${{ secrets.SIGNPATH_API_TOKEN != '' && github.ref_type == 'tag' }}
    defaults:
      run:
        shell: bash
    steps:
      # Baixa o código do repositório.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22 LTS + cache do npm (um lockfile por subprojeto).
      - name: Instalar Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/types/package-lock.json
            server/package-lock.json
            client/package-lock.json
            native/package-lock.json
            desktop/package-lock.json

      # Tipos compartilhados: usados pelo servidor e pelo cliente.
      - name: shared/types - instalar e compilar
        working-directory: shared/types
        run: |
          npm ci
          npm run build

      # Servidor de sinalização: só instala as dependências. O desktop gera depois um bundle
      # único com esbuild direto do código-fonte, então NÃO rodamos o `tsc` aqui (ele falha com
      # TS6059 porque importa tipos de shared/types, que fica fora do rootDir do servidor).
      - name: server - instalar dependências
        working-directory: server
        run: npm ci

      # Site (client/dist) que o app serve na mesma origem.
      - name: client - instalar e compilar
        working-directory: client
        run: |
          npm ci
          npm run build

      # Módulo nativo C++ (WASAPI/DXGI): só compila no Windows. Python e Visual Studio já vêm
      # no windows-latest.
      # IMPORTANTE: o addon usa node-addon-api com NAPI_VERSION=8 (N-API é ABI-estável).
      # Por isso pode ser compilado com o node-gyp padrão contra o Node 22 do runner e carregado
      # pelo Electron SEM rebuild específico para Electron (o Electron implementa N-API >= 8).
      # O runner tem o Visual Studio 2026 ("18"), que o node-gyp embutido no npm (11.x) não
      # reconhece. Por isso usamos o node-gyp 13.x local (devDependency) e instalamos com
      # --ignore-scripts, para o npm não disparar o `node-gyp rebuild` automático com a versão
      # antiga (o binding.gyp faz o npm rodar esse passo sozinho no install).
      - name: native - instalar e compilar addon
        working-directory: native
        run: |
          npm ci --ignore-scripts
          npx node-gyp --version
          npx node-gyp rebuild
          ls -la build/Release/screen_capture.node

      # Smoke test: falha cedo se o addon compilado não carregar (ABI, DLL ausente etc.).
      - name: native - smoke test (carregar o .node)
        working-directory: native
        shell: bash
        run: node -e "require('./build/Release/screen_capture.node')"

      # Dependências do app desktop (electron, electron-builder, esbuild).
      - name: desktop - instalar dependências
        working-directory: desktop
        run: npm ci

      # Versão semver única por build (1.0.<run_number>) em builds da main/manual; em tags v*
      # a versão da tag é usada. O electron-updater compara essa versão com a instalada.
      - name: desktop - definir versão do build
        id: ver
        working-directory: desktop
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="1.0.${RUN_NUMBER}"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Gera desktop/build/server/server.cjs (servidor embutido).
      - name: desktop - empacotar servidor (bundle:server)
        working-directory: desktop
        run: npm run bundle:server

      # Confere os artefatos e baixa o cloudflared.exe (com verificação de SHA-256).
      # CLOUDFLARED_VERSION e CLOUDFLARED_SHA256 vêm do env global do workflow (ver topo).
      # Ao atualizar a versão, recalcule o SHA-256 e atualize os dois campos juntos.
      - name: desktop - preparar recursos (prepare:resources)
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARED_VERSION: ${{ env.CLOUDFLARED_VERSION }}
          CLOUDFLARED_SHA256: ${{ env.CLOUDFLARED_SHA256 }}
        run: npm run prepare:resources

      # Gera o instalador NSIS (sem assinatura de código).
      - name: desktop - gerar instalador (dist:win)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist:win

      # Falha o job se o instalador não foi gerado.
      - name: Verificar instalador
        working-directory: desktop
        run: |
          ls -la release
          if ! ls release/KIARA-Setup-*.exe >/dev/null 2>&1; then
            echo "::error::Instalador release/KIARA-Setup-*.exe não foi gerado"
            exit 1
          fi

      # Assinatura de código via SignPath (https://signpath.io). Configuração única, feita no site
      # da SignPath e neste repositório (Settings > Secrets and variables > Actions):
      #   Segredo   SIGNPATH_API_TOKEN              token do usuário "submitter" do projeto
      #   Variável  SIGNPATH_ORGANIZATION_ID        ID da organização
      #   Variável  SIGNPATH_PROJECT_SLUG           slug do projeto
      #   Variável  SIGNPATH_SIGNING_POLICY_SLUG    slug da política (ex.: release-signing)
      # Artifact configuration do projeto na SignPath:
      #   <artifact-configuration xmlns="http://signpath.io/artifact-configuration/v1">
      #     <zip-file>
      #       <pe-file path="KIARA-Setup-*.exe"><authenticode-sign/></pe-file>
      #     </zip-file>
      #   </artifact-configuration>
      # Na política de código aberto, cada assinatura precisa de aprovação manual no site;
      # por isso só tags v* são assinadas.
      - name: Enviar instalador sem assinatura (entrada da SignPath)
        id: unsigned
        if: env.SIGN_INSTALLER == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KIARA-Setup-unsigned
          path: desktop/release/KIARA-Setup-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Assinar instalador (SignPath)
        if: env.SIGN_INSTALLER == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 2400
          output-artifact-directory: ${{ github.workspace }}/signed

      # Troca o instalador pelo assinado e recalcula hash/tamanho no latest.yml, senão o
      # auto-update recusaria o arquivo. O .blockmap antigo deixa de valer e é removido.
      - name: Aplicar instalador assinado e atualizar latest.yml
        if: env.SIGN_INSTALLER == 'true'
        working-directory: desktop
        run: |
          ls -la ../signed
          cp ../signed/KIARA-Setup-*.exe release/
          rm -f release/KIARA-Setup-*.exe.blockmap
          node scripts/refresh-latest-yml.mjs

      - name: Conferir assinatura
        if: env.SIGN_INSTALLER == 'true'
        shell: pwsh
        run: |
          $f = Get-ChildItem desktop/release/KIARA-Setup-*.exe | Select-Object -First 1
          $s = Get-AuthenticodeSignature $f.FullName
          Write-Host "$($f.Name): $($s.Status) - $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "Assinatura inválida: $($s.Status)" }

      # Guarda o instalador como artifact (aba do workflow > Artifacts).
      - name: Enviar instalador como artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KIARA-Setup-windows
          path: desktop/release/KIARA-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      # Arquivos do auto-update (latest.yml + .exe, e o .blockmap quando o build não é assinado)
      # para o job de publicação.
      - name: Enviar arquivos de atualização
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KIARA-update-files
          path: |
            desktop/release/KIARA-Setup-*.exe
            desktop/release/KIARA-Setup-*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7
    outputs:
      version: ${{ steps.ver.outputs.version }}

  # Publica a release (latest.yml + .exe + .blockmap) com o GITHUB_TOKEN padrão, sem segredos extras.
  # Main/manual: tag v1.0.<run_number>; tag v*: usa a própria tag.
  release:
    name: Publicar release
    needs: [verify, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar arquivos de atualização
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KIARA-update-files
          path: dist

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          TAG="v${VERSION}"
          HASH=$(sha256sum dist/KIARA-Setup-*.exe | cut -d' ' -f1)
          {
            echo "### Como instalar"
            echo
            echo "Baixe o \`KIARA-Setup-${VERSION}.exe\` abaixo e abra. Você pode escolher a pasta de instalação."
            echo
            echo "Se o Windows mostrar \"O Windows protegeu seu computador\", clique em **Mais informações** e depois em **Executar assim mesmo**."
            echo "O aviso aparece com programas novos ou pouco baixados. O código-fonte está aberto neste repositório."
            echo
            echo "Para conferir que o arquivo é o mesmo gerado aqui, o SHA-256 do instalador é:"
            echo
            echo "\`${HASH}\`"
            echo
            echo "No PowerShell: \`Get-FileHash .\\KIARA-Setup-${VERSION}.exe\`"
            echo
          } > notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "KIARA $TAG" \
            --latest \
            --notes-file notes.md \
            --generate-notes
