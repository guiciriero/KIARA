# Blueprint do Render: um único Web Service (plano Free) que serve o site e a sinalização.
services:
  - type: web
    name: kiara
    runtime: node
    plan: free
    buildCommand: >-
      cd shared/types && npm ci --include=dev && npm run build &&
      cd ../../server && npm ci --include=dev && npm run build &&
      cd ../client && npm ci --include=dev && npm run build
    startCommand: cd server && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Obrigatório no Render: o proxy da plataforma precisa alcançar o processo.
      - key: HOST
        value: 0.0.0.0
      # Site compilado, servido pelo próprio servidor (caminho relativo a server/).
      - key: CLIENT_DIST_DIR
        value: ../client/dist
      # Limites e proxy. O Render termina TLS e repassa o IP real via proxy (1 salto).
      - key: TRUST_PROXY
        value: 1
      - key: MAX_VIEWERS_PER_ROOM
        value: 8
      - key: ROOM_MAX_HOURS
        value: 12
      # TURN: credenciais efêmeras geradas pelo servidor (NÃO vão no bundle do cliente).
      # Use coturn (TURN_URLS + TURN_SECRET) OU Cloudflare Realtime TURN
      # (CLOUDFLARE_TURN_KEY_ID + CLOUDFLARE_TURN_API_TOKEN). Preencha no painel do Render.
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
