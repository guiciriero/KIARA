# Configuração do electron-builder (instalador Windows NSIS).
# Caminhos relativos a desktop/.
appId: com.kiara.app
productName: KIARA

directories:
  output: release

# Só o código do app entra no asar. Tudo o mais (node_modules de dev, build/,
# scripts/, resources/) fica de fora; os recursos pesados vão via extraResources.
files:
  - "src/**/*"
  - "package.json"
  - "assets/icon.png"

asar: true

# Contrato de recursos (process.resourcesPath quando empacotado).
# Ficam FORA do asar: o .node e o cloudflared.exe precisam ser arquivos reais.
extraResources:
  - from: build/server/server.cjs
    to: server/server.cjs
  - from: ../client/dist
    to: client
  - from: resources/bin/cloudflared.exe
    to: bin/cloudflared.exe
  - from: ../native/build/Release/screen_capture.node
    to: native/screen_capture.node
  # Versão/SHA do build (gerado por scripts/write-build-info.mjs)
  - from: build/build-info.json
    to: build-info.json

electronLanguages:
  - pt-BR
  - en-US

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "KIARA-Setup-${version}.${ext}"
  # SEM assinatura de código: nenhum campo de certificado (certificateFile,
  # signtoolOptions, azureSignOptions...) é definido de propósito.
  # Consequência: o Windows SmartScreen mostrará o aviso "Editor desconhecido".
  # O usuário deve clicar em "Mais informações" > "Executar assim mesmo".

nsis:
  oneClick: false                        # assistente com tela de escolha da pasta
  perMachine: false                      # padrão: instala por usuário, sem pedir administrador
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false

# Auto-update (electron-updater). O electron-builder gera latest.yml + .blockmap ao lado do
# instalador e embute o app-update.yml (feed padrão = Releases do GitHub deste repositório).
# O build NUNCA publica sozinho (--publish never); quem publica é o workflow do GitHub Actions.
# Repositório privado: o app não consulta o GitHub sem token (e token não pode ir no cliente);
# aponte o feed para um local público com KIARA_UPDATE_URL (ver README, "Atualização do aplicativo").
publish:
  provider: github
  owner: guiciriero
  repo: RTS-SS-KIARA
  releaseType: release
