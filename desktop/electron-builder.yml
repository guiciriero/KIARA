# Configuração do electron-builder (instalador Windows NSIS).
# Caminhos relativos a desktop/.
appId: com.kiara.app
productName: KIARA

directories:
  output: release

# Só o código do app entra no asar. Tudo o mais (node_modules de dev, build/,
# scripts/, resources/) fica de fora; os recursos pesados vão via extraResources.
files:
  - "src/**/*"
  - "package.json"
  - "assets/icon.png"

asar: true

# Hook que vira os Electron Fuses (RunAsNode, ASAR integrity etc.) antes da assinatura.
afterPack: scripts/apply-fuses.cjs

# Contrato de recursos (process.resourcesPath quando empacotado).
# Ficam FORA do asar: o .node e o cloudflared.exe precisam ser arquivos reais.
extraResources:
  - from: build/server/server.cjs
    to: server/server.cjs
  - from: ../client/dist
    to: client
  # cloudflared e addon nativo são declarados por plataforma (win/mac/linux, mais abaixo).
  # Versão/SHA do build (gerado por scripts/write-build-info.mjs)
  - from: build/build-info.json
    to: build-info.json

electronLanguages:
  - pt-BR
  - en-US

win:
  icon: assets/icon.ico
  extraResources:
    - from: resources/bin/cloudflared.exe
      to: bin/cloudflared.exe
    - from: ../native/build/Release/screen_capture.node
      to: native/screen_capture.node
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "KIARA-Setup-${version}.${ext}"
  # SEM assinatura de código: nenhum campo de certificado (certificateFile,
  # signtoolOptions, azureSignOptions...) é definido de propósito.
  # Consequência: o Windows SmartScreen mostrará o aviso "Editor desconhecido".
  # O usuário deve clicar em "Mais informações" > "Executar assim mesmo".

# ── Linux (EXPERIMENTAL, não executado) ───────────────────────────────────────
# Addon nativo opcional no Linux: se o .node não existir, o electron-builder só avisa
# ("file source doesn't exist") e o app roda sem ele (getDisplayMedia/PipeWire).
linux:
  icon: assets/icon.png
  category: AudioVideo
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: "KIARA-${version}-${arch}.${ext}"
  extraResources:
    - from: resources/bin/cloudflared
      to: bin/cloudflared
    - from: ../native/build/Release/screen_capture.node
      to: native/screen_capture.node

deb:
  maintainer: Guilherme Ciriero

# ── macOS (EXPERIMENTAL, não executado; SEM assinatura/notarização) ───────────
# Sem assinatura: o Gatekeeper bloqueia na 1ª abertura (botão direito > Abrir, ou
# `xattr -dr com.apple.quarantine KIARA.app`). identity: null pula a assinatura.
# O addon/cloudflared são do arquitetura do runner; para x64 e arm64 rode o build em cada runner.
mac:
  category: public.app-category.video
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: "KIARA-${version}-mac-${arch}.${ext}"
  extendInfo:
    NSScreenCaptureUsageDescription: "O KIARA precisa gravar a tela para compartilhá-la com os espectadores."
    NSAudioCaptureUsageDescription: "O KIARA captura o áudio dos aplicativos para transmiti-lo aos espectadores."
  extraResources:
    - from: resources/bin/cloudflared
      to: bin/cloudflared
    - from: ../native/build/Release/screen_capture.node
      to: native/screen_capture.node

nsis:
  oneClick: false                        # assistente com tela de escolha da pasta
  perMachine: false                      # padrão: instala por usuário, sem pedir administrador
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false

# Auto-update (electron-updater). O electron-builder gera latest.yml + .blockmap ao lado do
# instalador e embute o app-update.yml (feed padrão = Releases do GitHub deste repositório).
# O build NUNCA publica sozinho (--publish never); quem publica é o workflow do GitHub Actions.
# Repositório privado: o app não consulta o GitHub sem token (e token não pode ir no cliente);
# aponte o feed para um local público com KIARA_UPDATE_URL (ver README, "Atualização do aplicativo").
publish:
  provider: github
  owner: guiciriero
  repo: KIARA
  releaseType: release
