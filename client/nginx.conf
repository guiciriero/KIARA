worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Diretórios temporários graváveis por usuário não-root (rootfs somente leitura)
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log off;

  # Limita tamanho do corpo de requisição (mitigação de DoS via upload)
  client_max_body_size 16k;

  # Timeouts curtos para rejeitar conexões lentas / Slowloris
  client_header_timeout 15s;
  client_body_timeout   15s;

  # Limite de taxa: 20 req/s por IP; zona de 10 MB (~160 k IPs)
  # ⚠ O upgrade de WebSocket em /socket.io/ conta como 1 requisição, então a zona
  #   se aplica normalmente lá (conexões longas não geram novas requisições).
  limit_req_zone $binary_remote_addr zone=kiara_req:10m rate=20r/s;

  # Upgrade de WebSocket para o Socket.IO
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Servidor de sinalização (serviço "server" do docker-compose)
  upstream kiara_server {
    server server:3001;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # ── Cabeçalhos de segurança aplicados ao bloco server ──────────────────
    # NOTA: no nginx, add_header num location ANULA todos os add_header do server.
    # Por isso cada location que usa add_header repete o conjunto completo abaixo.
    # Alterações aqui DEVEM ser replicadas em todos os locations que usam add_header.
    #
    # frame-ancestors 'none' (+ DENY): o site não precisa ser embutido em nenhum iframe.
    # Permissions-Policy: desabilita APIs sensíveis que o site não usa.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(self), fullscreen=(self), screen-wake-lock=(self), autoplay=(self)" always;

    # Sinalização e download do app desktop vão para o servidor
    location /socket.io/ {
      # Rate limit: burst=40 absorve picos de reconexão; nodelay evita fila lenta
      limit_req zone=kiara_req burst=40 nodelay;

      proxy_pass http://kiara_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
    location /download {
      # Rate limit: previne download em massa
      limit_req zone=kiara_req burst=40 nodelay;

      proxy_pass http://kiara_server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker: sem cache longo (atualizações precisam chegar logo)
    # Repete TODOS os cabeçalhos de segurança — add_header aqui anularia os do server.
    # CSP restrita ao sw.js (sem fontes externas; só precisa de 'self' e connect-src).
    location = /sw.js {
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(self), fullscreen=(self), screen-wake-lock=(self), autoplay=(self)" always;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Manifesto PWA: sem cache (deve sempre refletir a versão atual)
    # Repete TODOS os cabeçalhos de segurança — add_header aqui anularia os do server.
    location = /manifest.webmanifest {
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(self), fullscreen=(self), screen-wake-lock=(self), autoplay=(self)" always;
      add_header Cache-Control "no-cache" always;
    }

    # index.html: sem cache; repete TODOS os cabeçalhos de segurança
    location = /index.html {
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(self), fullscreen=(self), screen-wake-lock=(self), autoplay=(self)" always;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Cache agressivo para assets com hash no nome; repete cabeçalhos de segurança
    location /assets/ {
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(self), fullscreen=(self), screen-wake-lock=(self), autoplay=(self)" always;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
    }

    # SPA fallback — sem add_header próprio, herda do server normalmente
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
