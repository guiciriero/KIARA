worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Headers de segurança
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; media-src 'self' blob:;";

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: todas as rotas retornam index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets com hash no nome
    location ~* \.(js|css|png|jpg|ico|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Sem cache para index.html
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
  }
}
