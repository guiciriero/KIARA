worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Diretórios temporários graváveis por usuário não-root (rootfs somente leitura)
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log off;

  # Upgrade de WebSocket para o Socket.IO
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Servidor de sinalização (serviço "server" do docker-compose)
  upstream kiara_server {
    server server:3001;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. O index.html não tem script inline: script-src 'self' basta.
    # style 'unsafe-inline' é necessário (estilos inline do React); fontes vêm do Google Fonts.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Sinalização e download do app desktop vão para o servidor
    location /socket.io/ {
      proxy_pass http://kiara_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
    location /download {
      proxy_pass http://kiara_server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker e manifesto: sem cache longo (atualizações precisam chegar logo)
    location = /sw.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'" always;
      add_header X-Content-Type-Options nosniff always;
    }
    location = /manifest.webmanifest {
      add_header Cache-Control "no-cache" always;
    }

    # Sem cache para index.html
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Cache agressivo para assets com hash no nome (em /assets/)
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
