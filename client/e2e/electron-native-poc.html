<!doctype html>
<html><body><script>
(async () => {
  try {
    const gen = new MediaStreamTrackGenerator({ kind: 'video' });
    const writer = gen.writable.getWriter();
    let track = gen;
    let gotFrames = 0, writeErr = '', cfg0 = null; const recv = [];
    const rstrip = document.createElement('canvas'); const rctx = rstrip.getContext('2d', { willReadFrequently: true });
    const decodeFrame = (vf) => {
      const vw = vf.displayWidth, vh = vf.displayHeight; const sh = Math.max(4, Math.ceil(vh * 48 / cfg0.dispH)); rstrip.width = vw; rstrip.height = sh;
      rctx.drawImage(vf, 0, 0, vw, sh, 0, 0, vw, sh); let id = 0;
      for (let i = 0; i < 12; i++) { const px = Math.round(((cfg0.dispW - 12 * 48 + i * 48 + 24) / cfg0.dispW) * vw); const d = rctx.getImageData(px, Math.round(sh / 2), 1, 1).data; if ((d[0] + d[1] + d[2]) / 3 > 127) id |= 1 << i; }
      return id;
    };
    window.poc.onTexture(async ({ importedSharedTexture }) => {
      const vf = importedSharedTexture.getVideoFrame();
      gotFrames++;
      if (cfg0 && cfg0.recv && gotFrames % 4 === 0) { try { recv.push({ id: decodeFrame(vf), t: performance.timeOrigin + performance.now() }); } catch (e) { writeErr = 'dec ' + e; } }
      importedSharedTexture.release();
      try { await writer.write(vf); } catch (e) { writeErr = String(e); }
      vf.close();
    });

    const pc1 = new RTCPeerConnection(), pc2 = new RTCPeerConnection();
    pc1.onicecandidate = (e) => e.candidate && pc2.addIceCandidate(e.candidate);
    pc2.onicecandidate = (e) => e.candidate && pc1.addIceCandidate(e.candidate);
    let inboundTrack = null;
    pc2.ontrack = (e) => { inboundTrack = e.track; };
    const cfg = await window.poc.ready(); cfg0 = cfg;
    if (cfg.source === 'gdm') {
      const ms = await navigator.mediaDevices.getDisplayMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60, max: 120 } } });
      track = ms.getVideoTracks()[0];
    }
    const sender = pc1.addTrack(track, new MediaStream([track]));
    console.log('cfg ' + JSON.stringify(cfg));

    const tx = pc1.getTransceivers()[0];
    const caps = RTCRtpSender.getCapabilities('video').codecs;
    const pref = caps.filter((c) => c.mimeType.toLowerCase() === 'video/' + cfg.codec.toLowerCase());
    if (pref.length) tx.setCodecPreferences(pref); else console.log('codec indisponivel: ' + cfg.codec);
    const p = sender.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = cfg.bitrate; p.encodings[0].maxFramerate = cfg.fps;
    if (cfg.scale > 1) p.encodings[0].scaleResolutionDownBy = cfg.scale;
    p.degradationPreference = 'maintain-resolution';
    await sender.setParameters(p);

    const offer = await pc1.createOffer();
    await pc1.setLocalDescription(offer);
    await pc2.setRemoteDescription(offer);
    const ans = await pc2.createAnswer();
    await pc2.setLocalDescription(ans);
    await pc1.setRemoteDescription(ans);

    const v = document.createElement('video'); v.muted = true; v.autoplay = true; v.style.cssText = 'width:384px;height:216px'; document.body.appendChild(v);
    await new Promise((r) => { const t = setInterval(() => { if (inboundTrack) { clearInterval(t); r(); } }, 50); });
    v.srcObject = new MediaStream([inboundTrack]); await v.play().catch(() => {});
    const shown = [], seen = []; let go = true;
    const strip = document.createElement('canvas'); const sctx = strip.getContext('2d', { willReadFrequently: true });
    const decodeId = () => {
      const vw = v.videoWidth, vh = v.videoHeight; if (!vw) return -1;
      const sh = Math.max(4, Math.ceil(vh * 48 / cfg.dispH)); strip.width = vw; strip.height = sh;
      sctx.drawImage(v, 0, 0, vw, sh, 0, 0, vw, sh);
      let id = 0;
      for (let i = 0; i < 12; i++) {
        const px = Math.round(((cfg.dispW - 12 * 48 + i * 48 + 24) / cfg.dispW) * vw), py = Math.round(sh / 2);
        const d = sctx.getImageData(px, py, 1, 1).data; if ((d[0] + d[1] + d[2]) / 3 > 127) id |= 1 << i;
      }
      return id;
    };
    const cb = (now) => { if (!go) return; shown.push(now); const id = decodeId(); if (id >= 0) seen.push({ id, t: performance.timeOrigin + performance.now() }); v.requestVideoFrameCallback(cb); };
    v.requestVideoFrameCallback(cb);

    await new Promise((r) => setTimeout(r, 3000));
    const pick = (s, type) => { let o; s.forEach((x) => { if (x.type === type && (x.kind === 'video' || x.mediaType === 'video')) o = x; }); return o; };
    const o0 = pick(await pc1.getStats(), 'outbound-rtp'), i0 = pick(await pc2.getStats(), 'inbound-rtp');
    const t0 = performance.now(), g0 = gotFrames, sh0 = shown.length;
    await new Promise((r) => setTimeout(r, cfg.secs * 1000));
    const dt = (performance.now() - t0) / 1000;
    const o1 = pick(await pc1.getStats(), 'outbound-rtp'), i1 = pick(await pc2.getStats(), 'inbound-rtp');
    go = false;
    const vis = shown.slice(sh0);
    const iv = vis.slice(1).map((q, i) => q - vis[i]).sort((a, b) => a - b);
    const q = (f) => +(iv[Math.floor(iv.length * f)] ?? 0).toFixed(1);
    const result = {
      codecAsked: cfg.codec, impl: o1.encoderImplementation, decImpl: i1.decoderImplementation,
      gotFramesPerSec: +((gotFrames - g0) / dt).toFixed(1),
      encodedFps: +((o1.framesEncoded - o0.framesEncoded) / dt).toFixed(1),
      sentFps: +((o1.framesSent - o0.framesSent) / dt).toFixed(1),
      decodedFps: +((i1.framesDecoded - i0.framesDecoded) / dt).toFixed(1),
      shownFps: +((shown.length - sh0) / dt).toFixed(1), shownIntervalMs: { p50: q(.5), p99: q(.99), max: +(iv[iv.length - 1] ?? 0).toFixed(1) },
      res: o1.frameWidth + 'x' + o1.frameHeight, inRes: i1.frameWidth + 'x' + i1.frameHeight,
      encodeMs: +(((o1.totalEncodeTime - o0.totalEncodeTime) / Math.max(1, o1.framesEncoded - o0.framesEncoded)) * 1000).toFixed(2),
      decodeMs: +(((i1.totalDecodeTime - i0.totalDecodeTime) / Math.max(1, i1.framesDecoded - i0.framesDecoded)) * 1000).toFixed(2),
      kbps: Math.round((o1.bytesSent - o0.bytesSent) * 8 / dt / 1000),
      freezes: (i1.freezeCount ?? 0) - (i0.freezeCount ?? 0), qualityLimit: o1.qualityLimitationReason,
      jbDelayMs: +(((i1.jitterBufferDelay - i0.jitterBufferDelay) / Math.max(1, i1.jitterBufferEmittedCount - i0.jitterBufferEmittedCount)) * 1000).toFixed(1),
      writeErr, seen: seen.slice(sh0), recv,
    };
    await window.poc.done(result);
  } catch (e) {
    console.log('ERRO ' + (e && e.stack || e));
    await window.poc.done({ error: String(e) });
  }
})();
</script></body></html>
