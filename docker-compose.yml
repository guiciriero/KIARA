# docker-compose.yml
# Implantação 100% gratuita, autônoma e self-hosted do KIARA
# Inclui servidor de sinalização Node.js + Servidor TURN/STUN Coturn próprio

version: '3.8'

services:
  # Servidor Coturn: Fornece STUN e TURN para contornar CGNAT e firewalls simétricos
  coturn:
    image: coturn/coturn:latest
    container_name: kiara-coturn
    restart: unless-stopped
    network_mode: "host"
    environment:
      - DETECT_EXTERNAL_IP=yes
    command:
      - turnserver
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=49252
      - --listening-port=3478
      - --tls-listening-port=5349
      - --realm=kiara.local
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?defina TURN_SECRET no ambiente}
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient 127.0.0.1 3478 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Servidor KIARA: Sinalização WebRTC, Salas Persistentes e Site SPA
  kiara-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: kiara-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3001
      - DATA_DIR=/app/data
      - MAX_VIEWERS_PER_ROOM=20
      - ROOM_MAX_HOURS=24
      - TURN_URLS=turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp
      - TURN_SECRET=${TURN_SECRET:?defina TURN_SECRET no ambiente}
    volumes:
      - kiara_data:/app/data
    depends_on:
      - coturn
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 4s
      retries: 3

volumes:
  kiara_data:
    driver: local

